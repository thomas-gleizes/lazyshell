name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Perf budget
        run: go test -run TestPerfBudget ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # v9 is the first major version defaulting to the golangci-lint v2 line,
      # which our .golangci.yml targets. The version is pinned to the one used
      # locally so CI and `make lint` cannot disagree.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      # site/assets/config-schema.json is generated, not hand-written (see
      # pkg/config/doc.go's //go:generate and cmd/gen-config-schema) — this
      # is that file's doc_test.go: it fails the build the same way a stale
      # README table would, instead of silently letting the committed JSON
      # drift from Config/ProjectConfig. Runs once here, not in the test
      # job's matrix, since generation has no OS-specific behavior.
      - name: Generated config-schema.json is up to date
        run: |
          go generate ./...
          git diff --exit-code -- site/assets/config-schema.json
