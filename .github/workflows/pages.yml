name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Le site est du HTML statique écrit à la main : rien à construire, on publie
# le dossier tel quel.
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; une nouvelle ne double pas une en cours,
# mais on laisse celle qui tourne finir plutôt que de la couper en plein
# déploiement.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
