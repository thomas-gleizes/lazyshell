<script>
  // Send a visitor straight to the version matching their browser, but only

    if (document.referrer && new URL(document.referrer).host === location.host) return;
    var lang = (navigator.language || "en").toLowerCase();
    location.replace(lang.indexOf("fr") === 0 ? "fr/" : "en/");
  })();
</script>
