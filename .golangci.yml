version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  settings:
    misspell:
      # Le code et les commentaires sont en français : misspell ne connaît que
      # l'anglais et signale les mots français homographes d'une faute anglaise.
      ignore-rules:
        - commandes
        - existant
        - surveill
  exclusions:
    presets:
      - comments
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
